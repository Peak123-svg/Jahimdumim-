<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update</title>
    <!-- Include Three.js for the 3D survival game section -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }

        .container {
            padding: 20px;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-wrapper {
            position: relative;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 24px;
        }

        img {
            max-width: 250px;
            height: auto;
            display: block;
            pointer-events: none;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake {
            animation: shake 0.2s ease;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin: 0;
            color: #e2e8f0;
            text-transform: lowercase;
        }

        #gameCanvas {
            display: none;
            background: #000000;
            border: 1px solid #ffffff;
        }

        /* 3D Survival Game Container & UI */
        #survivalContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 5;
            cursor: crosshair;
        }

        #survivalHUD {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 6;
            text-shadow: 0 0 5px #000;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 6;
        }

        /* FNF Rhythm Game UI */
        #fnfContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #111;
            z-index: 15;
            overflow: hidden;
        }

        #fnfCanvas {
            display: block;
            background: #181818;
            margin: 0 auto;
        }

        /* Custom Jumpscare Screen Overlay */
        #jumpscareScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #jumpscareScreen img {
            max-width: 400px;
            height: auto;
            margin-bottom: 20px;
        }

        #jumpscareScreen h2 {
            color: #ff0000;
            font-family: monospace;
            font-size: 3rem;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 0 0 10px #ff0000;
        }

        /* Blank Red Crash Screen */
        #crashScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ff0000;
            z-index: 50;
        }

        #endScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            color: #ffffff;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.025em;
            text-transform: lowercase;
            z-index: 10;
        }

        /* Update Watermark */
        #updateWatermark {
            position: fixed;
            bottom: 15px;
            left: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-family: monospace;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 100;
            text-transform: lowercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="image-wrapper" id="clickArea">
            <img src="https://raw.githubusercontent.com/Peak123-svg/Jahimdumim-/main/1274_Sem_Titulo_20250617215305.webp" alt="update image">
        </div>
        <h1>he will update you</h1>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <!-- 3D Survival Mini-Game UI -->
    <div id="survivalContainer">
        <div id="survivalHUD">Artifacts: 0 / 7</div>
        <div id="crosshair"></div>
    </div>

    <!-- FNF Rhythm Game Container -->
    <div id="fnfContainer">
        <canvas id="fnfCanvas" width="800" height="600"></canvas>
    </div>

    <!-- Custom Jumpscare Overlay -->
    <div id="jumpscareScreen">
        <img src="https://raw.githubusercontent.com/Peak123-svg/Jahimdumim-/main/image.png" alt="jumpscare">
        <h2>YOU DIED</h2>
    </div>

    <!-- Crash Screen Overlay -->
    <div id="crashScreen"></div>

    <div id="endScreen">soon after this</div>

    <!-- Corner Version Text -->
    <div id="updateWatermark">update</div>

    <script>
        const clickArea = document.getElementById('clickArea');
        const mainContainer = document.getElementById('mainContainer');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const endScreen = document.getElementById('endScreen');

        let clickCount = 0;

        clickArea.addEventListener('click', () => {
            clickCount++;
            
            clickArea.classList.remove('shake');
            void clickArea.offsetWidth;
            clickArea.classList.add('shake');

            if (clickCount >= 13) {
                startGame();
            }
        });

        function startGame() {
            mainContainer.style.display = 'none';
            canvas.style.display = 'block';

            let player = { 
                x: 50, y: 300, width: 24, height: 24, 
                vx: 0, vy: 0, speed: 4, sprintSpeed: 8.5, 
                jumpPower: -10.5, grounded: false 
            };
            
            let gravity = 0.55;
            let keys = { Left: false, Right: false, Shift: false };
            
            let stamina = 100;
            let maxStamina = 100;
            let staminaAlpha = 0; 
            let trail = [];

            let notification = {
                text: "press [SHIFT] to sprint over long gaps",
                alpha: 1,
                timer: 200
            };

            let platforms = [
                { x: 0, y: 380, w: 220, h: 70 },
                { x: 300, y: 330, w: 90, h: 15 },
                { x: 470, y: 270, w: 90, h: 15 },
                { x: 640, y: 220, w: 90, h: 15 },
                { x: 810, y: 170, w: 90, h: 15 },
                { x: 990, y: 130, w: 90, h: 15 },
                { x: 1180, y: 90, w: 140, h: 20 }
            ];

            let goal = { x: 1240, y: 20, w: 40, h: 70 };
            let worldWidth = 1400;

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
                if (e.key === 'Shift') keys.Shift = true;
                if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
                if (e.key === 'Shift') keys.Shift = false;
            });

            function resetPlayer() {
                player.x = 50;
                player.y = 300;
                player.vx = 0;
                player.vy = 0;
                stamina = maxStamina;
            }

            function update() {
                let isSprinting = keys.Shift && stamina > 0 && (keys.Left || keys.Right);
                let currentSpeed = isSprinting ? player.sprintSpeed : player.speed;

                if (keys.Left) player.vx = -currentSpeed;
                else if (keys.Right) player.vx = currentSpeed;
                else player.vx = 0;

                if (isSprinting) {
                    stamina = Math.max(0, stamina - 1.5);
                    staminaAlpha = 1; 
                } else {
                    stamina = Math.min(maxStamina, stamina + 0.5); 
                    if (stamina >= maxStamina && !keys.Shift) {
                        staminaAlpha = Math.max(0, staminaAlpha - 0.05); 
                    } else if (keys.Shift && stamina <= 0) {
                        staminaAlpha = Math.max(0, staminaAlpha - 0.05); 
                    }
                }

                player.x += player.vx;
                player.vy += gravity;
                player.y += player.vy;

                player.grounded = false;
                for (let p of platforms) {
                    if (
                        player.x < p.x + p.w &&
                        player.x + player.width > p.x &&
                        player.y + player.height > p.y &&
                        player.y + player.height - player.vy <= p.y
                    ) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }

                if (player.y > canvas.height + 100) {
                    resetPlayer();
                }

                if (isSprinting) {
                    trail.push({ x: player.x, y: player.y, alpha: 0.6 });
                }
                for (let i = trail.length - 1; i >= 0; i--) {
                    trail[i].alpha -= 0.1;
                    if (trail[i].alpha <= 0) {
                        trail.splice(i, 1);
                    }
                }

                if (notification.timer > 0) {
                    notification.timer--;
                } else {
                    notification.alpha = Math.max(0, notification.alpha - 0.02);
                }

                if (
                    player.x < goal.x + goal.w &&
                    player.x + player.width > goal.x &&
                    player.y < goal.y + goal.h &&
                    player.y + player.height > goal.y
                ) {
                    canvas.style.display = 'none';
                    start3DSurvivalGame();
                    return;
                }

                draw();
                requestAnimationFrame(update);
            }

            function draw() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let cameraX = player.x - canvas.width / 2 + player.width / 2;
                if (cameraX < 0) cameraX = 0;
                if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

                ctx.save();
                ctx.translate(-cameraX, 0);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                for (let p of platforms) {
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

                for (let t of trail) {
                    ctx.fillStyle = `rgba(59, 130, 246, ${t.alpha})`;
                    ctx.fillRect(t.x, t.y, player.width, player.height);
                }

                ctx.fillStyle = '#000000';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(player.x, player.y, player.width, player.height);

                ctx.restore();

                if (notification.alpha > 0) {
                    ctx.save();
                    ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = `rgba(255, 255, 255, ${notification.alpha})`;
                    ctx.textAlign = 'center';
                    ctx.fillText(notification.text, canvas.width / 2, 50);
                    ctx.restore();
                }

                if (staminaAlpha > 0) {
                    ctx.save();
                    ctx.globalAlpha = staminaAlpha;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(canvas.width - 130, 20, 100, 8);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(canvas.width - 130, 20, (stamina / maxStamina) * 100, 8);
                    ctx.restore();
                }
            }

            update();
        }

        // ==========================================
        // 3D SURVIVAL GAME (7 Artifacts Target)
        // ==========================================
        function start3DSurvivalGame() {
            const container = document.getElementById('survivalContainer');
            const hud = document.getElementById('survivalHUD');
            const jumpscare = document.getElementById('jumpscareScreen');
            container.style.display = 'block';

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            const renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const floorEdges = new THREE.EdgesGeometry(floorGeo);
            const floorLine = new THREE.LineSegments(floorEdges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            floorLine.rotation.x = -Math.PI / 2;
            scene.add(floorLine);

            const walls = [];

            function createWall(x, z, w, d) {
                const geom = new THREE.BoxGeometry(w, 3, d);
                const mesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ color: 0x000000 }));
                mesh.position.set(x, 1.5, z);
                scene.add(mesh);

                const edges = new THREE.EdgesGeometry(geom);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
                mesh.add(line);

                walls.push({ x, z, w, d });
            }

            createWall(0, -40, 80, 1);
            createWall(0, 40, 80, 1);
            createWall(-40, 0, 1, 80);
            createWall(40, 0, 1, 80);
            
            createWall(-15, -20, 25, 2);
            createWall(15, 20, 25, 2);
            createWall(-20, 15, 2, 25);
            createWall(20, -15, 2, 25);
            createWall(0, -10, 2, 20);
            createWall(-10, 0, 20, 2);
            createWall(25, 25, 15, 2);
            createWall(-25, -25, 2, 15);

            let collectedArtifacts = 0;
            const artifacts = [];
            const artifactGeo = new THREE.BoxGeometry(1, 1, 1);
            
            const positions = [
                {x: -32, z: -32},
                {x: 32, z: -32},
                {x: -32, z: 32},
                {x: 32, z: 32},
                {x: 0, z: -35},
                {x: 0, z: 35},
                {x: -30, z: 0}
            ];

            positions.forEach(pos => {
                const boxMesh = new THREE.Mesh(artifactGeo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
                const edges = new THREE.EdgesGeometry(artifactGeo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
                boxMesh.add(line);
                
                boxMesh.position.set(pos.x, 0.5, pos.z);
                scene.add(boxMesh);
                artifacts.push(boxMesh);
            });

            const textureLoader = new THREE.TextureLoader();
            let monsterMesh = null;
            let isDead = false;
            let gameRunning = true; // Flag to track when 3D game stops
            let animationFrameId = null;
            
            textureLoader.load('https://raw.githubusercontent.com/Peak123-svg/Jahimdumim-/main/image.png', (texture) => {
                const monsterMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
                monsterMesh = new THREE.Sprite(monsterMat);
                monsterMesh.scale.set(2.2, 3.2, 1);
                monsterMesh.position.set(0, 1.6, -30);
                scene.add(monsterMesh);
            });

            let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
            let pitch = 0, yaw = 0;

            container.addEventListener('click', () => {
                if (!isDead && gameRunning) {
                    container.requestPointerLock();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (gameRunning && !isDead && document.pointerLockElement === container) {
                    yaw -= e.movementX * 0.003;
                    pitch -= e.movementY * 0.003;
                    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                    
                    camera.rotation.set(0, 0, 0);
                    camera.rotateY(yaw);
                    camera.rotateX(pitch);
                }
            });

            window.addEventListener('keydown', (e) => {
                if (!gameRunning) return;
                if (e.key === 'w' || e.key === 'W') moveForward = true;
                if (e.key === 's' || e.key === 'S') moveBackward = true;
                if (e.key === 'a' || e.key === 'A') moveLeft = true;
                if (e.key === 'd' || e.key === 'D') moveRight = true;
            });

            window.addEventListener('keyup', (e) => {
                if (!gameRunning) return;
                if (e.key === 'w' || e.key === 'W') moveForward = false;
                if (e.key === 's' || e.key === 'S') moveBackward = false;
                if (e.key === 'a' || e.key === 'A') moveLeft = false;
                if (e.key === 'd' || e.key === 'D') moveRight = false;
            });

            function animate3D() {
                if (!gameRunning) return;
                animationFrameId = requestAnimationFrame(animate3D);
                if (isDead) return;

                const speed = 0.09;
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();

                const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

                let nextX = camera.position.x;
                let nextZ = camera.position.z;

                if (moveForward) { nextX += dir.x * speed; nextZ += dir.z * speed; }
                if (moveBackward) { nextX -= dir.x * speed; nextZ -= dir.z * speed; }
                if (moveLeft) { nextX += sideDir.x * speed; nextZ += sideDir.z * speed; }
                if (moveRight) { nextX -= sideDir.x * speed; nextZ -= sideDir.z * speed; }

                let collided = false;
                for (let w of walls) {
                    if (
                        nextX > w.x - w.w/2 - 0.5 && nextX < w.x + w.w/2 + 0.5 &&
                        nextZ > w.z - w.d/2 - 0.5 && nextZ < w.z + w.d/2 + 0.5
                    ) {
                        collided = true;
                        break;
                    }
                }

                if (!collided) {
                    camera.position.x = nextX;
                    camera.position.z = nextZ;
                }

                artifacts.forEach((art, index) => {
                    if (art && camera.position.distanceTo(art.position) < 1.5) {
                        scene.remove(art);
                        artifacts[index] = null;
                        collectedArtifacts++;
                        hud.innerText = `Artifacts: ${collectedArtifacts} / 7`;

                        if (collectedArtifacts >= 7) {
                            gameRunning = false; // Stop 3D loop completely
                            cancelAnimationFrame(animationFrameId);
                            if (document.pointerLockElement) document.exitPointerLock();
                            container.style.display = 'none';
                            startFNFBattle();
                        }
                    }
                });

                if (monsterMesh && gameRunning) {
                    const monsterSpeed = 0.07;
                    const directionToPlayer = new THREE.Vector3()
                        .subVectors(camera.position, monsterMesh.position);
                    directionToPlayer.y = 0;
                    directionToPlayer.normalize();

                    monsterMesh.position.addScaledVector(directionToPlayer, monsterSpeed);

                    if (monsterMesh.position.distanceTo(camera.position) < 1.2) {
                        isDead = true;
                        if (document.pointerLockElement) document.exitPointerLock();
                        jumpscare.style.display = 'flex';

                        setTimeout(() => {
                            jumpscare.style.display = 'none';
                            camera.position.set(0, 1.6, 5);
                            monsterMesh.position.set(0, 1.6, -30);
                            yaw = 0;
                            pitch = 0;
                            camera.rotation.set(0, 0, 0);
                            isDead = false;
                        }, 1500);
                    }
                }

                renderer.render(scene, camera);
            }

            animate3D();
        }

        // ==========================================
        // FNF RHYTHM BATTLE SECTION (OG Difficulty & Setup Restored)
        // ==========================================
        function startFNFBattle() {
            const fnfContainer = document.getElementById('fnfContainer');
            const fnfCanvas = document.getElementById('fnfCanvas');
            const fnfCtx = fnfCanvas.getContext('2d');
            const crashScreen = document.getElementById('crashScreen');
            fnfContainer.style.display = 'block';

            const playerImg = new Image();
            playerImg.src = 'https://raw.githubusercontent.com/Peak123-svg/Jahimdumim-/main/6a483e08c9e4c_download.jpeg';
            
            const monsterImg = new Image();
            monsterImg.src = 'https://raw.githubusercontent.com/Peak123-svg/Jahimdumim-/main/image.png';

            // Load and play custom user audio track
            const bgMusic = new Audio('https://raw.githubusercontent.com/Peak123-svg/Jahimdumim-/main/CRAZDIN!.mp3');
            bgMusic.loop = true;
            bgMusic.volume = 0.8;
            bgMusic.play().catch(e => console.log("Audio play blocked, clicking may resume: ", e));

            let health = 50; 
            let score = 0;
            const scrollSpeed = 6; // Restored OG fast high difficulty speed
            const hitY = 100;

            // Restored OG dense and intense note chart
            let notes = [];
            for (let t = 1; t < 35; t += 0.35) {
                let lane = Math.floor(Math.random() * 4);
                notes.push({ time: t, lane: lane, hit: false, missed: false });
                if (Math.random() > 0.4) {
                    let lane2 = (lane + 2) % 4;
                    notes.push({ time: t, lane: lane2, hit: false, missed: false });
                }
            }

            const laneKeys = ['ArrowLeft', 'ArrowDown', 'ArrowUp', 'ArrowRight'];
            const altKeys = ['a', 's', 'w', 'd'];

            window.addEventListener('keydown', handleKeyPress);

            function handleKeyPress(e) {
                let lane = -1;
                if (laneKeys.indexOf(e.key) !== -1) lane = laneKeys.indexOf(e.key);
                if (altKeys.indexOf(e.key) !== -1) lane = altKeys.indexOf(e.key);

                if (lane !== -1) {
                    let hitAny = false;
                    for (let n of notes) {
                        if (!n.hit && !n.missed && n.lane === lane) {
                            let currentAudioTime = bgMusic.currentTime;
                            let noteY = hitY + (n.time - currentAudioTime) * 60 * scrollSpeed;
                            if (Math.abs(noteY - hitY) < 45) {
                                n.hit = true;
                                score += 100;
                                health = Math.min(100, health + 4);
                                hitAny = true;
                                break;
                            }
                        }
                    }
                    if (!hitAny) {
                        health = Math.max(0, health - 3);
                        checkDeath();
                    }
                }
            }

            function checkDeath() {
                if (health <= 0) {
                    bgMusic.pause();
                    window.removeEventListener('keydown', handleKeyPress);
                    fnfContainer.style.display = 'none';
                    crashScreen.style.display = 'block';
                }
            }

            function drawArrow(ctx, x, y, lane, color) {
                ctx.save();
                ctx.fillStyle = color;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.translate(x + 25, y + 25);
                
                let rot = 0;
                if (lane === 0) rot = -Math.PI / 2;     // Left
                if (lane === 1) rot = Math.PI;          // Down
                if (lane === 2) rot = 0;                // Up
                if (lane === 3) rot = Math.PI / 2;      // Right
                ctx.rotate(rot);

                ctx.moveTo(0, -18);
                ctx.lineTo(14, 2);
                ctx.lineTo(5, 2);
                ctx.lineTo(5, 16);
                ctx.lineTo(-5, 16);
                ctx.lineTo(-5, 2);
                ctx.lineTo(-14, 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            const arrowColors = ['#ff0055', '#00ffff', '#12fa05', '#ffaa00'];

            function fnfLoop() {
                fnfCtx.fillStyle = '#111111';
                fnfCtx.fillRect(0, 0, fnfCanvas.width, fnfCanvas.height);

                let currentAudioTime = bgMusic.currentTime;

                if (monsterImg.complete) {
                    fnfCtx.drawImage(monsterImg, 100, 180, 140, 180);
                }
                if (playerImg.complete) {
                    fnfCtx.drawImage(playerImg, 560, 180, 140, 180);
                }

                fnfCtx.fillStyle = '#555';
                fnfCtx.fillRect(198, 48, 404, 24);
                fnfCtx.fillStyle = '#ff0000';
                fnfCtx.fillRect(200, 50, 400, 20);
                fnfCtx.fillStyle = '#00ff00';
                fnfCtx.fillRect(200, 50, (health / 100) * 400, 20);

                if (monsterImg.complete) fnfCtx.drawImage(monsterImg, 160, 40, 40, 40);
                if (playerImg.complete) fnfCtx.drawImage(playerImg, 600, 40, 40, 40);

                let startX = 280;
                let laneWidth = 60;
                for (let i = 0; i < 4; i++) {
                    let lx = startX + i * laneWidth;
                    fnfCtx.strokeStyle = 'rgba(255,255,255,0.15)';
                    fnfCtx.strokeRect(lx, 0, laneWidth, fnfCanvas.height);

                    drawArrow(fnfCtx, lx + 5, hitY, i, 'rgba(255,255,255,0.4)');
                }

                for (let n of notes) {
                    if (!n.hit) {
                        let noteY = hitY + (n.time - currentAudioTime) * 60 * scrollSpeed;
                        let nx = startX + n.lane * laneWidth + 5;
                        if (noteY > -60 && noteY < fnfCanvas.height + 60) {
                            drawArrow(fnfCtx, nx, noteY, n.lane, arrowColors[n.lane]);
                        }
                        if (noteY < hitY - 40 && !n.missed) {
                            n.missed = true;
                            health = Math.max(0, health - 6);
                            checkDeath();
                        }
                    }
                }

                fnfCtx.fillStyle = '#ffffff';
                fnfCtx.font = '18px monospace';
                fnfCtx.fillText(`Score: ${score}`, 360, 110);

                if (health > 0 && !bgMusic.ended) {
                    requestAnimationFrame(fnfLoop);
                } else if (bgMusic.ended) {
                    fnfContainer.style.display = 'none';
                    endScreen.style.display = 'flex';
                }
            }

            fnfLoop();
        }
    </script>
