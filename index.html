<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }

        .container {
            padding: 20px;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-wrapper {
            position: relative;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 24px;
        }

        img {
            max-width: 250px;
            height: auto;
            display: block;
            pointer-events: none;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake {
            animation: shake 0.2s ease;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin: 0;
            color: #e2e8f0;
            text-transform: lowercase;
        }

        #gameCanvas {
            display: none;
            background: #000000;
            border: 1px solid #ffffff;
        }

        #endScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            color: #ffffff;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.025em;
            text-transform: lowercase;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="image-wrapper" id="clickArea">
            <img src="https://raw.githubusercontent.com/Peak123-svg/Jahimdumim-/main/1274_Sem_Titulo_20250617215305.webp" alt="update image">
        </div>
        <h1>he will update you</h1>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="endScreen">more after this soon</div>

    <script>
        const clickArea = document.getElementById('clickArea');
        const mainContainer = document.getElementById('mainContainer');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const endScreen = document.getElementById('endScreen');

        let clickCount = 0;

        clickArea.addEventListener('click', () => {
            clickCount++;
            
            clickArea.classList.remove('shake');
            void clickArea.offsetWidth;
            clickArea.classList.add('shake');

            if (clickCount >= 13) {
                startGame();
            }
        });

        function startGame() {
            mainContainer.style.display = 'none';
            canvas.style.display = 'block';

            let player = { 
                x: 50, y: 300, width: 24, height: 24, 
                vx: 0, vy: 0, speed: 4, sprintSpeed: 8.5, 
                jumpPower: -10.5, grounded: false 
            };
            
            let gravity = 0.55;
            let keys = { Left: false, Right: false, Shift: false };
            
            let stamina = 100;
            let maxStamina = 100;
            let staminaAlpha = 0; 
            let trail = [];

            let notification = {
                text: "press [SHIFT] to sprint",
                alpha: 1,
                timer: 200
            };

            // Harder layout: tight platforms, precise jumps, demanding longer spans requiring sprint
            let platforms = [
                { x: 0, y: 380, w: 200, h: 70 },
                { x: 300, y: 320, w: 50, h: 12 },
                { x: 420, y: 260, w: 45, h: 12 },
                { x: 540, y: 190, w: 40, h: 12 },
                { x: 650, y: 280, w: 45, h: 12 },
                { x: 770, y: 340, w: 50, h: 12 },
                { x: 890, y: 240, w: 40, h: 12 },
                { x: 1010, y: 170, w: 45, h: 12 },
                { x: 1130, y: 250, w: 40, h: 12 },
                { x: 1250, y: 320, w: 45, h: 12 },
                { x: 1370, y: 210, w: 40, h: 12 },
                { x: 1490, y: 140, w: 45, h: 12 },
                { x: 1610, y: 230, w: 40, h: 12 },
                { x: 1730, y: 300, w: 50, h: 12 },
                { x: 1850, y: 190, w: 45, h: 12 },
                { x: 1980, y: 120, w: 90, h: 15 } // Goal platform
            ];

            let goal = { x: 2010, y: 50, w: 40, h: 70 };
            let worldWidth = 2150;

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
                if (e.key === 'Shift') keys.Shift = true;
                if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
                if (e.key === 'Shift') keys.Shift = false;
            });

            function resetPlayer() {
                player.x = 50;
                player.y = 300;
                player.vx = 0;
                player.vy = 0;
                stamina = maxStamina;
            }

            function update() {
                let isSprinting = keys.Shift && stamina > 0 && (keys.Left || keys.Right);
                let currentSpeed = isSprinting ? player.sprintSpeed : player.speed;

                if (keys.Left) player.vx = -currentSpeed;
                else if (keys.Right) player.vx = currentSpeed;
                else player.vx = 0;

                if (isSprinting) {
                    stamina = Math.max(0, stamina - 1.5);
                    staminaAlpha = 1; 
                } else {
                    stamina = Math.min(maxStamina, stamina + 0.5); 
                    if (stamina >= maxStamina && !keys.Shift) {
                        staminaAlpha = Math.max(0, staminaAlpha - 0.05); 
                    } else if (keys.Shift && stamina <= 0) {
                        staminaAlpha = Math.max(0, staminaAlpha - 0.05); 
                    }
                }

                player.x += player.vx;
                player.vy += gravity;
                player.y += player.vy;

                player.grounded = false;
                for (let p of platforms) {
                    if (
                        player.x < p.x + p.w &&
                        player.x + player.width > p.x &&
                        player.y + player.height > p.y &&
                        player.y + player.height - player.vy <= p.y
                    ) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }

                if (player.y > canvas.height + 100) {
                    resetPlayer();
                }

                if (isSprinting) {
                    trail.push({ x: player.x, y: player.y, alpha: 0.6 });
                }
                for (let i = trail.length - 1; i >= 0; i--) {
                    trail[i].alpha -= 0.1;
                    if (trail[i].alpha <= 0) {
                        trail.splice(i, 1);
                    }
                }

                if (notification.timer > 0) {
                    notification.timer--;
                } else {
                    notification.alpha = Math.max(0, notification.alpha - 0.02);
                }

                if (
                    player.x < goal.x + goal.w &&
                    player.x + player.width > goal.x &&
                    player.y < goal.y + goal.h &&
                    player.y + player.height > goal.y
                ) {
                    canvas.style.display = 'none';
                    endScreen.style.display = 'flex';
                    return;
                }

                draw();
                requestAnimationFrame(update);
            }

            function draw() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let cameraX = player.x - canvas.width / 2 + player.width / 2;
                if (cameraX < 0) cameraX = 0;
                if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

                ctx.save();
                ctx.translate(-cameraX, 0);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                for (let p of platforms) {
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

                // Distinct blue motion trail during sprint
                for (let t of trail) {
                    ctx.fillStyle = `rgba(59, 130, 246, ${t.alpha})`;
                    ctx.fillRect(t.x, t.y, player.width, player.height);
                }

                ctx.fillStyle = '#000000';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(player.x, player.y, player.width, player.height);

                ctx.restore();

                if (notification.alpha > 0) {
                    ctx.save();
                    ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = `rgba(255, 255, 255, ${notification.alpha})`;
                    ctx.textAlign = 'center';
                    ctx.fillText(notification.text, canvas.width / 2, 50);
                    ctx.restore();
                }

                if (staminaAlpha > 0) {
                    ctx.save();
                    ctx.globalAlpha = staminaAlpha;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(canvas.width - 130, 20, 100, 8);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(canvas.width - 130, 20, (stamina / maxStamina) * 100, 8);
                    ctx.restore();
                }
            }

            update();
        }
    </script>
</body>
</html>
