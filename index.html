<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }

        .container {
            padding: 20px;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-wrapper {
            position: relative;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 24px;
        }

        img {
            max-width: 250px;
            height: auto;
            display: block;
            pointer-events: none;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake {
            animation: shake 0.2s ease;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin: 0 0 10px 0;
            color: #e2e8f0;
            text-transform: lowercase;
        }

        .counter {
            font-size: 0.85rem;
            color: #64748b;
        }

        #gameCanvas {
            display: none;
            background: #020617;
            border: 2px solid #334155;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }

        #endScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            color: #fff;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.025em;
            text-transform: lowercase;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="image-wrapper" id="clickArea">
            <img src="https://raw.githubusercontent.com/Peak123-svg/Jahimdumim-/main/1274_Sem_Titulo_20250617215305.webp" alt="update image">
        </div>
        <h1>he will update you</h1>
        <div class="counter" id="clickCounter">clicks: 0/13</div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="endScreen">more after this soon</div>

    <script>
        const clickArea = document.getElementById('clickArea');
        const mainContainer = document.getElementById('mainContainer');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const endScreen = document.getElementById('endScreen');
        const clickCounter = document.getElementById('clickCounter');

        let clickCount = 0;

        clickArea.addEventListener('click', () => {
            clickCount++;
            clickCounter.textContent = `clicks: ${clickCount}/13`;
            
            clickArea.classList.remove('shake');
            void clickArea.offsetWidth;
            clickArea.classList.add('shake');

            if (clickCount >= 13) {
                startGame();
            }
        });

        function startGame() {
            mainContainer.style.display = 'none';
            canvas.style.display = 'block';

            // Game variables
            let player = { 
                x: 50, y: 300, width: 28, height: 28, 
                vx: 0, vy: 0, speed: 4.5, sprintSpeed: 8, 
                jumpPower: -11.5, grounded: false 
            };
            
            let gravity = 0.55;
            let keys = { Left: false, Right: false, Shift: false };
            
            // Sprint & Trail mechanics
            let stamina = 100;
            let maxStamina = 100;
            let staminaAlpha = 0; // For fading in/out the bar
            let trail = [];

            // Notification message state
            let notification = {
                text: "press [SHIFT] to sprint",
                alpha: 1,
                timer: 240 // frames to stay fully visible before fading
            };

            // Hard scrolling platform layout spanning across a wide level
            let platforms = [
                { x: 0, y: 380, w: 450, h: 70 },
                { x: 500, y: 320, w: 140, h: 20 },
                { x: 720, y: 250, w: 100, h: 20 },
                { x: 900, y: 300, w: 120, h: 20 },
                { x: 1100, y: 220, w: 90, h: 20 },
                { x: 1280, y: 160, w: 110, h: 20 },
                { x: 1480, y: 230, w: 90, h: 20 },
                { x: 1650, y: 300, w: 130, h: 20 },
                { x: 1850, y: 220, w: 100, h: 20 },
                { x: 2040, y: 150, w: 160, h: 30 } // Final goal platform
            ];

            let goal = { x: 2100, y: 80, w: 40, h: 70 };

            window.addEventListener('keydown', (e) => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = true;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = true;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.Shift = true;
                if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = false;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = false;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.Shift = false;
            });

            function update() {
                // Determine current speed based on sprint input and stamina
                let isSprinting = keys.Shift && stamina > 0 && (keys.Left || keys.Right);
                let currentSpeed = isSprinting ? player.sprintSpeed : player.speed;

                if (keys.Left) player.vx = -currentSpeed;
                else if (keys.Right) player.vx = currentSpeed;
                else player.vx = 0;

                // Handle stamina drain and recovery
                if (isSprinting) {
                    stamina = Math.max(0, stamina - 1.2);
                    staminaAlpha = Math.min(1, staminaAlpha + 0.1); // Fade in
                } else {
                    stamina = Math.min(maxStamina, stamina + 0.6); // Recharges slowly
                    if (stamina >= maxStamina && !keys.Shift) {
                        staminaAlpha = Math.max(0, staminaAlpha - 0.05); // Fade out when full/inactive
                    } else if (keys.Shift && stamina <= 0) {
                        staminaAlpha = Math.max(0, staminaAlpha - 0.05); // Fade out if depleted
                    }
                }

                player.x += player.vx;
                player.vy += gravity;
                player.y += player.vy;

                // Collision with platforms
                player.grounded = false;
                for (let p of platforms) {
                    if (
                        player.x < p.x + p.w &&
                        player.x + player.width > p.x &&
                        player.y + player.height > p.y &&
                        player.y + player.height - player.vy <= p.y
                    ) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }

                // Fall into the void boundary reset
                if (player.y > canvas.height + 100) {
                    player.x = 50;
                    player.y = 300;
                    player.vx = 0;
                    player.vy = 0;
                    stamina = maxStamina;
                }

                // Record trail positions while sprinting
                if (isSprinting) {
                    trail.push({ x: player.x, y: player.y, alpha: 0.6 });
                }
                // Update existing trail pieces (fade out)
                for (let i = trail.length - 1; i >= 0; i--) {
                    trail[i].alpha -= 0.08;
                    if (trail[i].alpha <= 0) {
                        trail.splice(i, 1);
                    }
                }

                // Notification fading timer
                if (notification.timer > 0) {
                    notification.timer--;
                } else {
                    notification.alpha = Math.max(0, notification.alpha - 0.02);
                }

                // Win condition
                if (
                    player.x < goal.x + goal.w &&
                    player.x + player.width > goal.x &&
                    player.y < goal.y + goal.h &&
                    player.y + player.height > goal.y
                ) {
                    canvas.style.display = 'none';
                    endScreen.style.display = 'flex';
                    return;
                }

                draw();
                requestAnimationFrame(update);
            }

            function draw() {
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Camera follow logic (smooth horizontal centering)
                let cameraX = player.x - canvas.width / 2 + player.width / 2;
                if (cameraX < 0) cameraX = 0;
                if (cameraX > 2200 - canvas.width) cameraX = 2200 - canvas.width;

                ctx.save();
                ctx.translate(-cameraX, 0);

                // Draw platforms
                ctx.fillStyle = '#1e293b';
                for (let p of platforms) {
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }

                // Draw goal marker
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

                // Draw sprint motion trail
                for (let t of trail) {
                    ctx.fillStyle = `rgba(56, 189, 248, ${t.alpha})`;
                    ctx.fillRect(t.x, t.y, player.width, player.height);
                }

                // Draw player (black cube)
                ctx.fillStyle = '#000000';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(player.x, player.y, player.width, player.height);

                ctx.restore();

                // Draw fading notification banner (fixed on screen)
                if (notification.alpha > 0) {
                    ctx.save();
                    ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = `rgba(226, 232, 240, ${notification.alpha})`;
                    ctx.textAlign = 'center';
                    ctx.fillText(notification.text, canvas.width / 2, 50);
                    ctx.restore();
                }

                // Draw fading stamina bar (fixed on screen top right)
                if (staminaAlpha > 0) {
                    ctx.save();
                    ctx.globalAlpha = staminaAlpha;
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(canvas.width - 130, 20, 100, 10);
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(canvas.width - 130, 20, (stamina / maxStamina) * 100, 10);
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(canvas.width - 130, 20, 100, 10);
                    ctx.restore();
                }
            }

            update();
        }
    </script>
</body>
</html>
